spring.application.name=backend
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]
spring.devtools.restart.enabled=false

server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/recruitment_db1}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.cv-folder=${CLOUDINARY_CV_FOLDER:recruitment/cvs}
cloudinary.company-logo-folder=${CLOUDINARY_COMPANY_LOGO_FOLDER:recruitment/company-logos}
cloudinary.candidate-avatar-folder=${CLOUDINARY_CANDIDATE_AVATAR_FOLDER:recruitment/candidate-avatars}

spring.jackson.time-zone=Asia/Bangkok
spring.jpa.open-in-view=false

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

jwt.secret=${JWT_SECRET:ThisIsASecretKeyForJwtAuthenticationMustBeAtLeast32BytesLong}
jwt.expiration=${JWT_EXPIRATION:86400000}

google.client-id=${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com}

# Mail (đọc từ .env)
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
services:
  db:
    image: mysql:8.0
    container_name: recruitment-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: recruitment_db1
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - recruitment-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: recruitment-backend:latest
    container_name: recruitment-backend
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/recruitment_db1?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Bangkok
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

      LOGGING_LEVEL_ORG_FLYWAYDB: "DEBUG"

      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_LOCATIONS: "classpath:db/migration"
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_JPA_HIBERNATE_DDL_AUTO: "update"

      JWT_SECRET: ThisIsASecretKeyForJwtAuthenticationMustBeAtLeast32BytesLong
      GOOGLE_CLIENT_ID: 278300133755-gaho7bghdckdquguts7kfh5j62jlh2t2.apps.googleusercontent.com

    ports:
      - "8080:8080"

volumes:
  recruitment-db-data:
